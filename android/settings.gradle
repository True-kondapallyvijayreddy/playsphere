pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    // 8.6 is the floor for androidx.core 1.16.0, which share_plus 12.x pulls in.
    // 8.7 is also the first line tested against compileSdk 35 (Flutter 3.27's
    // default), so it drops the "tested up to compileSdk 33" warning too.
    id "com.android.application" version "8.7.3" apply false
    // share_plus 12.x compiles its Kotlin sources against the 2.2.0 stdlib. The
    // Kotlin plugin declared here compiles every plugin module, so anything
    // older than 2.2 fails to read that metadata ("expected version is 1.8.0").
    id "org.jetbrains.kotlin.android" version "2.2.0" apply false
    id "com.google.gms.google-services" version "4.4.2" apply false
    // Uploads the ProGuard mapping and the native symbols so a release crash
    // arrives as a readable stack rather than as obfuscated frames. The
    // firebase_crashlytics Dart plugin reports without it; the reports are
    // just unreadable.
    id "com.google.firebase.crashlytics" version "3.0.2" apply false
}

include ":app"
