plugins {
    id "com.android.application"
    id "kotlin-android"
    id "com.google.gms.google-services"
    id "com.google.firebase.crashlytics"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.company.playsphere"
    compileSdk = flutter.compileSdkVersion
    // Firebase, share_plus, and several other plugins require NDK 27; the
    // Flutter-default ndkVersion resolves lower and fails the plugin check.
    ndkVersion = "27.0.12077973"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId = "com.company.playsphere"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        // Firebase Auth 23.x declares minSdk 23, so Flutter's default of 21
        // fails the manifest merge and the Android app cannot be built at all.
        // Pinned explicitly rather than tracking flutter.minSdkVersion: this
        // floor is set by our Firebase dependency, not by the Flutter SDK, and
        // a Flutter upgrade must not silently move it back down.
        // API 23 (Android 6.0) is ~99% of active devices.
        minSdk = 23
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}
