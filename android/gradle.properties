# Heap for the Gradle daemon. 4G is comfortable on a 16GB machine even with
# the Firestore emulator (JVM) and an Android emulator running alongside —
# builds here are CPU-bound, not memory-bound.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError

android.useAndroidX=true

# Jetifier rewrites every dependency from the old support library to AndroidX
# on every build, and it is slow. Nothing here needs it: the Flutter plugins
# and the Firebase SDKs are all AndroidX-native already. Leaving it on was
# paying that cost for no benefit.
android.enableJetifier=false

# Build independent modules concurrently. Four cores, so the win is modest
# but real.
org.gradle.parallel=true

# Reuse task outputs between builds. The first build after a clean is
# unchanged; every one after that skips work it has already done.
org.gradle.caching=true

# Configure only the projects needed for the requested tasks.
org.gradle.configureondemand=true

# Ship native .so libraries uncompressed inside the bundle. Required for the
# 16 KB memory page-size support Play has mandated since Nov 2025 — a
# compressed library cannot be page-aligned, so the loader cannot mmap it.
# Pairs with packagingOptions { jniLibs { useLegacyPackaging = false } }.
android.bundle.enableUncompressedNativeLibs=true

# Silence AGP 8.7's "compileSdk 36 has not been tested with this AGP" notice.
# API 36 support landed in AGP 8.9; 8.7.3 compiles against it correctly and is
# the version pinned for 16 KB alignment, so the warning is informational.
android.suppressUnsupportedCompileSdk=36
