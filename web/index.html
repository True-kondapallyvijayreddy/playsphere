<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="PlaySphere Sports Operating System">

  <!-- Web OAuth client for Google Sign-In.
       Firebase Auth's signInWithPopup does not need this, but the
       google_sign_in_web plugin asserts a client ID is present the moment it
       initialises. Declaring it here means the plugin can never abort startup
       even if something touches it. Public by design: an OAuth client ID is
       not a secret and ships in every web client. -->
  <meta name="google-signin-client_id"
        content="178810835926-c3bijks5k6f7t9lcms0op4igq1sdesuq.apps.googleusercontent.com">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="PlaySphere">
  <!-- iOS ignores the manifest's icons and reads this instead, so a page
       saved to a home screen from Safari would otherwise get a screenshot of
       itself rather than the mark. -->
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <meta name="theme-color" content="#0A0A0A">

  <!-- Start-up latency, not decoration.
       The engine's CanvasKit build (~2.1MB compressed) is fetched from
       gstatic, and Firestore/Auth are hit the moment the app boots — but the
       browser learns none of those origins until main.dart.js has downloaded,
       parsed and run. Each one then costs a fresh DNS + TLS handshake on the
       critical path. Warming the connections here overlaps that cost with the
       bundle download instead of queueing behind it.

       `main.dart.js` is preloaded rather than merely discovered: it is
       referenced from flutter_bootstrap.js, so without this the browser does
       not start fetching the largest file in the app until a second script has
       run. `scripts/hash_web_bundle.sh` rewrites the name here in lockstep
       with the bundle, so this link cannot point at a file that is not there. -->
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://securetoken.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin>
  <link rel="preload" href="main.dart.js" as="script">

  <title>PlaySphere Sports OS</title>
</head>
<body>
  <script>
    // Belt to `web/sw_selfdestruct.js`'s braces.
    //
    // That worker is what actually rescues a device stuck on an old build,
    // because it runs even when this file was served from a stale cache. This
    // script is the second line of defence, for the visitor who DOES reach a
    // fresh index.html: it clears any worker and any CacheStorage left behind,
    // so the next navigation cannot be answered from a previous build.
    //
    // Why neither alone is enough, kept here because it cost real time twice:
    // by the time this script runs, an already-installed worker has served the
    // page from CacheStorage, and a mobile reload does not bypass a worker the
    // way desktop devtools does. The no-cache headers in `firebase.json` do
    // not help either — the worker answers without reaching the network.
    //
    // So the build MUST be made with:
    //
    //     flutter build web --release --pwa-strategy=none
    //
    // and deployed through the `predeploy` hook in `firebase.json`, which
    // replaces the empty worker that flag emits with the self-destructing one.
    // Drop either and stale-on-mobile comes straight back.
    (function () {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          for (var i = 0; i < regs.length; i++) regs[i].unregister();
        }).catch(function () {});
      }
      // Named caches are the old worker's copy of index.html and main.dart.js.
      // Nothing in this app reads CacheStorage deliberately, so clearing all
      // of it discards only stale build artefacts.
      if (window.caches && caches.keys) {
        caches.keys().then(function (names) {
          for (var i = 0; i < names.length; i++) caches.delete(names[i]);
        }).catch(function () {});
      }
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
