name: playsphere
description: >
  PlaySphere — a sports operating system for schools, colleges, communities
  and associations. One codebase for Android, iOS and the web.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  # Telugu, Hindi and English from Phase 1 — CLAUDE.md 2.6 makes this a MUST,
  # and retrofitting i18n after the UI is built is far more expensive than
  # carrying it from the start.
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.0

  # Firebase — the entire backend.
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.0.0

  # Memories (CLAUDE.md §6 Module C): photos and short clips attached to a
  # match. Bucket is playsphere-os.firebasestorage.app in asia-south1, the
  # same region as Firestore — see storage.rules.
  firebase_storage: ^12.3.0

  # Push notifications (CLAUDE.md §6 Module A / §3): event reminders, match
  # start, results, membership approvals, challenges. WhatsApp/SMS fallback
  # is a separate abstraction in core/notifications — this package only
  # carries the FCM leg.
  firebase_messaging: ^15.1.3

  # Google Sign-In. On the web `firebase_auth` handles the popup itself, so
  # this package is only exercised on Android and iOS — see
  # core/auth/auth_service.dart for the platform split.
  google_sign_in: ^6.2.1

  # Durable offline scoring queue. A match scored on a ground with no signal
  # must survive the app being killed before it reconnects.
  shared_preferences: ^2.2.3

  # Picking and downscaling a memory before upload. Rural 4G means the client
  # must shrink an 8MP camera photo rather than pushing 6MB up the wire.
  image_picker: ^1.1.2

  # Disk-caching every remote image the app draws — crests, banners, faces.
  # Flutter's built-in ImageCache is memory-only and per-process, so scrolling
  # back up a members list re-downloaded every face over mobile data. That is
  # the single largest avoidable data cost in an app that already downscales
  # uploads to 1600px for exactly this reason. All remote images go through
  # `shared/identity.dart`, never `Image.network` directly.
  cached_network_image: ^3.4.1

  # Presentation
  intl: ^0.19.0

  cupertino_icons: ^1.0.8
  share_plus: ^12.0.2

  # Opening a vendor's product page from the shop. PlaySphere lists kit and
  # hands the purchase to the retailer who actually holds the stock — see
  # `data/shop_repository.dart` for why the checkout is deliberately theirs
  # and not ours.
  url_launcher: ^6.3.0
  firebase_crashlytics: ^4.3.10
  qr_flutter: ^4.1.0
  geolocator: ^13.0.0
  cloud_functions: ^5.6.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Branding generators. Both are build-time only — they write the platform
  # icon and splash resources into android/, ios/ and web/ and are never
  # linked into the app, which is why they are dev dependencies.
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  # Builds AppLocalizations from lib/l10n/*.arb per l10n.yaml.
  generate: true

  # Only the one file the app actually draws. The rest of assets/branding/ —
  # the 1024px icon, the adaptive foreground, the splash poster, the master
  # logo — are SOURCES for the two generators below: they are baked into
  # android/, ios/ and web/ at build time and would otherwise ride along in
  # the bundle as ~3.5MB nobody ever loads, on the ₹8k phones §2.8 targets.
  assets:
    - assets/branding/mark.png

# -----------------------------------------------------------------------------
# App icon.
#
# The launcher icon is the MARK alone (assets/branding/icon.png), not the full
# logo. At 48dp on a phone the "PLAYSPHERE" wordmark and its strapline are two
# illegible grey bands; the mark reads at every size. The wordmark still
# appears wherever there is room for it — the splash and the app bar.
#
# Android adaptive icons take a separate foreground because the launcher masks
# it to whatever shape the device uses (circle, squircle, teardrop) and keeps
# only the inner ~66%. `icon_foreground.png` is the mark inset on transparency
# for exactly that crop; the black behind it is the brand's own background.
# -----------------------------------------------------------------------------
flutter_launcher_icons:
  image_path: "assets/branding/icon.png"
  android: "ic_launcher"
  adaptive_icon_background: "#0A0A0A"
  adaptive_icon_foreground: "assets/branding/icon_foreground.png"
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/branding/icon.png"
    background_color: "#0A0A0A"
    theme_color: "#63B22B"

# -----------------------------------------------------------------------------
# Splash screen.
#
# `android_12` is a separate block and not a duplicate: from Android 12 the
# system draws the splash itself from a single centred icon and a background
# colour, and ignores a full-bleed image entirely. Given only the artwork, the
# honest mapping is the full poster on 11 and below, and the mark on the brand
# black on 12+, which is the most that platform will show.
#
# The background is the artwork's own near-black, so the moment before the
# image paints is not a white flash on a dark screen.
# -----------------------------------------------------------------------------
flutter_native_splash:
  color: "#0A0A0A"
  image: "assets/branding/splash.png"
  fullscreen: true
  android: true
  ios: true
  web: false

  android_12:
    image: "assets/branding/icon_foreground.png"
    color: "#0A0A0A"
    icon_background_color: "#0A0A0A"
