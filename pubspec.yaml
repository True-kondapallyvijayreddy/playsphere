name: playsphere
description: >
  PlaySphere - Event & Competition Operating System.
  Multi-tenant platform for organizations to create, manage, execute,
  analyze, and archive events and competitions.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Routing
  go_router: ^14.2.0

  # Networking
  dio: ^5.4.3
  retrofit: ^4.1.0

  # Realtime / Backend services
  firebase_core: ^3.1.0
  firebase_messaging: ^15.0.0
  cloud_firestore: ^5.0.0
  supabase_flutter: ^2.5.6

  # Models / serialization
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

  # Local storage / caching
  shared_preferences: ^2.2.3
  hive_flutter: ^1.1.0

  # QR / scanning (check-in, digital ID, certificates)
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.1.1

  # Media
  image_picker: ^1.1.2
  cached_network_image: ^3.3.1
  video_player: ^2.9.1

  # Charts (analytics dashboards)
  fl_chart: ^0.68.0

  # Utilities
  intl: ^0.19.0
  equatable: ^2.0.5
  logger: ^2.4.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  build_runner: ^2.4.11
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0
  retrofit_generator: ^8.1.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/data/
  # fonts:
  #   - family: Poppins
  #     fonts:
  #       - asset: assets/fonts/Poppins-Regular.ttf
  #       - asset: assets/fonts/Poppins-Bold.ttf
  #         weight: 700
