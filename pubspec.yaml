name: playsphere
description: >
  PlaySphere — a sports operating system for schools, colleges, communities
  and associations. One codebase for Android, iOS and the web.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.0

  # Firebase — the entire backend.
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.0.0

  # Google Sign-In. On the web `firebase_auth` handles the popup itself, so
  # this package is only exercised on Android and iOS — see
  # core/auth/auth_service.dart for the platform split.
  google_sign_in: ^6.2.1

  # Connectivity, so the scoring pad knows when it is queueing offline rather
  # than guessing from failed writes.
  connectivity_plus: ^6.0.3

  # Durable offline scoring queue. A match scored on a ground with no signal
  # must survive the app being killed before it reconnects.
  shared_preferences: ^2.2.3

  # Presentation
  fl_chart: ^0.68.0
  cached_network_image: ^3.3.1
  intl: ^0.19.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
